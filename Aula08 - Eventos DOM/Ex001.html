<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            font: normal 20pt Arial;
            background: rgb(78, 77, 77);
            color: white;
            width: 200px;
            height: 200px;
            
            line-height: 200px;
            text-align: center;
        }
        
    </style>
</head>
<body> <!--  CONFIGURANDO UM EVENTO NA PARTE HTML  -->
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        Interaja...
    </div>
    <script>
        var a = window.document.getElementById('area')
        function clicar(){
            //Tudo dentro desse bloco só será executado se ocorrer o EVENTO de clicar
            
            a.innerText = 'Clicou!'
            a.style.background = 'rgb(51, 95, 199)'
        }

        function entrar(){
            //Tudo dentro desse bloco só será executado se ocorrer o EVENTO de entrar
            
            a.innerText = 'Entrou!'
        }

        function sair(){

            a.innerText = 'Saiu!'
            a.style.background = 'rgb(78, 77, 77)'
        }
    </script>
</body>
</html>
