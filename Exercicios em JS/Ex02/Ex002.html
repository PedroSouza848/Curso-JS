<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <p>
                <label for="ano">Ano de Nascimento:</label>
                <input type="number" name="ano" id="ano">
            </p>
            <p>
                Sexo:
                <input type="radio" name="sexo" id="masc" value="M"> <label for="masc">Masculino</label>
                <input type="radio" name="sexo" id="fem" value="F" checked> <label for="fem">Feminino</label>
            </p>
            <p><input type="button" value="Verificar" onclick="verificar()"></p>
        </div>
        <div id="res">
            Preencha os dados acima para ver os resultados!
        </div>
    </section>
    <footer>
        <p>&copy;CursoemVideo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
